# Every push to main that carries a new version number in package.json becomes a release:
# GitHub builds the installers on real Windows and Mac machines and publishes them.
# Installed copies of Focus pick the new version up on their own.
# `npm run release` bumps the version, commits and pushes in one go.
name: Release

on:
  push:
    branches: [main]
    paths: ['package.json', '.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      new: ${{ steps.create.outputs.new }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' 2>/dev/null | grep -qx 'Focus-Setup.exe'; then
            echo "Release $TAG already has its installer; nothing to build."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
              gh release create "$TAG" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Focus $TAG" --generate-notes
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: release
    if: needs.release.outputs.new == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Build Mac app
        if: runner.os == 'macOS'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac --publish never

      - name: List build output
        shell: bash
        run: ls -la dist

      - name: Upload to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release.outputs.tag }}
          fail_on_unmatched_files: false
          files: |
            dist/Focus-Setup.exe
            dist/Focus-Setup.exe.blockmap
            dist/latest.yml
            dist/Focus-mac.dmg
